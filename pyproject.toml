[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlx-deepseek-ocr"
version = "0.1.0"
description = "DeepSeek-OCR (baidu/Unlimited-OCR) ported to Apple MLX for Apple Silicon"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "mlx>=0.29.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "transformers>=4.40.0",
    "safetensors>=0.4.0",
    "PyMuPDF>=1.23.0",
    "huggingface_hub>=0.20.0",
]

[project.optional-dependencies]
convert = ["torch>=2.0.0"]
dev = ["pytest>=7.0", "pytest-timeout", "torch>=2.0.0"]

[project.scripts]
mlx-ocr = "ocr:main"

[tool.setuptools]
py-modules = ["ocr", "convert"]

[tool.setuptools.packages.find]
include = ["model*", "processing*", "inference*", "utils*"]
